services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        user: autofacture
        uid: 1000
    image: autofacture-php:dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - autofacture

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: autofacture
      MARIADB_USER: autofacture
      MARIADB_PASSWORD: autofacture
      MARIADB_ROOT_PASSWORD: autofacture-root
    ports:
      - "33006:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - autofacture

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www:ro
      - ./docker-compose/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - autofacture

  scheduler:
    image: autofacture-php:dev
    restart: unless-stopped
    working_dir: /var/www
    command: >-
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - autofacture

volumes:
  db:

networks:
  autofacture:
    driver: bridge
