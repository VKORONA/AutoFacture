name: Baseline AutoFacture

on:
  push:
    branches:
      - develop/mvp-france-ai
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend PHP
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, bcmath, curl, dom, fileinfo, json, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Vérifier composer.json
        run: composer validate --no-check-publish

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Inventorier les vulnérabilités PHP
        run: composer audit || true

  frontend:
    name: Frontend Vue
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm

      - name: Installer les dépendances frontend
        run: npm ci

      - name: Vérifier le code frontend
        run: npm run test

      - name: Construire le frontend
        run: npm run build

      - name: Inventorier les vulnérabilités NPM
        run: npm audit --omit=dev || true
