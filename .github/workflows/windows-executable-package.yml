name: AutoFacture Windows executable package

on:
  pull_request:
    branches:
      - feature/micro-entrepreneur-turnover
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Préparer les dépendances PHP
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          vendor/bin/pint \
            app/Domain/MicroEntrepreneur/MicroEntrepreneurTurnoverCalculator.php \
            app/Models/EstimateItem.php \
            app/Models/InvoiceItem.php

      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Construire l'interface Vue
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compiler le lanceur Windows
        shell: bash
        run: |
          mkdir -p build-launcher
          cat > build-launcher/main.go <<'GOEOF'
          package main

          import (
            "bufio"
            "fmt"
            "io"
            "net/http"
            "os"
            "os/exec"
            "path/filepath"
            "runtime"
            "strings"
            "time"
          )

          const appURL = "http://localhost"

          func main() {
            exe, err := os.Executable()
            if err != nil { fatal("Impossible de déterminer le dossier de l'application", err) }
            dir := filepath.Dir(exe)
            logFile, _ := os.OpenFile(filepath.Join(dir, "AutoFacture-lancement.log"), os.O_CREATE|os.O_WRONLY|os.O_APPEND, 0644)
            if logFile != nil { defer logFile.Close() }
            out := io.MultiWriter(os.Stdout, logFile)

            fmt.Fprintln(out, "AutoFacture — démarrage de la dernière version GitHub")
            fmt.Fprintln(out, "Dossier :", dir)

            if _, err := exec.LookPath("docker"); err != nil {
              message("Docker Desktop est nécessaire. Installez ou démarrez Docker Desktop, puis relancez AutoFacture.exe.")
              pause()
              return
            }

            if !dockerReady(dir) {
              fmt.Fprintln(out, "Docker Desktop n'est pas encore disponible. Tentative de démarrage...")
              startDockerDesktop()
              deadline := time.Now().Add(3 * time.Minute)
              for time.Now().Before(deadline) {
                if dockerReady(dir) { break }
                time.Sleep(3 * time.Second)
              }
            }
            if !dockerReady(dir) {
              message("Docker Desktop ne répond pas. Ouvrez Docker Desktop, attendez qu'il soit prêt, puis relancez AutoFacture.exe.")
              pause()
              return
            }

            envPath := filepath.Join(dir, ".env")
            if _, err := os.Stat(envPath); os.IsNotExist(err) {
              if err := copyFile(filepath.Join(dir, ".env.example"), envPath); err != nil { fatal("Création du fichier .env impossible", err) }
            }

            firstLaunch := false
            marker := filepath.Join(dir, ".autofacture_initialized")
            if _, err := os.Stat(marker); os.IsNotExist(err) { firstLaunch = true }

            fmt.Fprintln(out, "Démarrage des services AutoFacture...")
            if err := compose(out, dir, "up", "-d", "--build"); err != nil {
              message("Le démarrage Docker a échoué. Consultez AutoFacture-lancement.log.")
              pause()
              return
            }

            if firstLaunch {
              fmt.Fprintln(out, "Initialisation de la base et du compte local...")
              steps := [][]string{
                {"exec", "-T", "app", "composer", "install", "--no-interaction", "--prefer-dist", "--optimize-autoloader"},
                {"exec", "-T", "app", "php", "artisan", "key:generate", "--force"},
                {"exec", "-T", "app", "php", "artisan", "migrate", "--seed", "--force"},
                {"exec", "-T", "app", "php", "artisan", "autofacture:bootstrap-local"},
              }
              for _, step := range steps {
                if err := compose(out, dir, step...); err != nil {
                  message("L'initialisation AutoFacture a échoué. Consultez AutoFacture-lancement.log.")
                  pause()
                  return
                }
              }
              _ = os.WriteFile(marker, []byte(time.Now().Format(time.RFC3339)), 0644)
            } else {
              _ = compose(out, dir, "exec", "-T", "app", "php", "artisan", "migrate", "--force")
            }

            fmt.Fprintln(out, "Vérification de l'application...")
            deadline := time.Now().Add(2 * time.Minute)
            for time.Now().Before(deadline) {
              if httpReady() { break }
              time.Sleep(2 * time.Second)
            }
            if !httpReady() {
              message("AutoFacture a démarré mais la page locale ne répond pas encore. Consultez AutoFacture-lancement.log et Docker Desktop.")
              pause()
              return
            }

            fmt.Fprintln(out, "AutoFacture est prêt :", appURL)
            fmt.Fprintln(out, "Identifiant : admin")
            fmt.Fprintln(out, "Mot de passe : autofacture-dev")
            openBrowser(appURL)
          }

          func compose(out io.Writer, dir string, args ...string) error {
            cmdArgs := append([]string{"compose"}, args...)
            cmd := exec.Command("docker", cmdArgs...)
            cmd.Dir = dir
            cmd.Stdout = out
            cmd.Stderr = out
            cmd.Stdin = os.Stdin
            return cmd.Run()
          }

          func dockerReady(dir string) bool {
            cmd := exec.Command("docker", "info")
            cmd.Dir = dir
            cmd.Stdout = io.Discard
            cmd.Stderr = io.Discard
            return cmd.Run() == nil
          }

          func startDockerDesktop() {
            candidates := []string{
              filepath.Join(os.Getenv("ProgramFiles"), "Docker", "Docker", "Docker Desktop.exe"),
              filepath.Join(os.Getenv("ProgramW6432"), "Docker", "Docker", "Docker Desktop.exe"),
              filepath.Join(os.Getenv("LOCALAPPDATA"), "Docker", "Docker Desktop.exe"),
            }
            for _, path := range candidates {
              if path == "" { continue }
              if _, err := os.Stat(path); err == nil {
                _ = exec.Command(path).Start()
                return
              }
            }
          }

          func httpReady() bool {
            client := http.Client{Timeout: 3 * time.Second}
            resp, err := client.Get(appURL)
            if err != nil { return false }
            defer resp.Body.Close()
            return resp.StatusCode >= 200 && resp.StatusCode < 500
          }

          func openBrowser(url string) {
            if runtime.GOOS == "windows" {
              _ = exec.Command("rundll32", "url.dll,FileProtocolHandler", url).Start()
              return
            }
          }

          func copyFile(src, dst string) error {
            in, err := os.Open(src)
            if err != nil { return err }
            defer in.Close()
            out, err := os.Create(dst)
            if err != nil { return err }
            defer out.Close()
            _, err = io.Copy(out, in)
            return err
          }

          func message(text string) {
            escaped := strings.ReplaceAll(text, "'", "''")
            script := "Add-Type -AssemblyName PresentationFramework; [System.Windows.MessageBox]::Show('" + escaped + "','AutoFacture')"
            _ = exec.Command("powershell", "-NoProfile", "-Command", script).Run()
            fmt.Println(text)
          }

          func fatal(text string, err error) {
            message(fmt.Sprintf("%s : %v", text, err))
            pause()
            os.Exit(1)
          }

          func pause() {
            fmt.Print("Appuyez sur Entrée pour fermer...")
            _, _ = bufio.NewReader(os.Stdin).ReadString('\n')
          }
          GOEOF
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o AutoFacture.exe ./build-launcher/main.go

      - name: Créer le ZIP Windows
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/AutoFacture
          rsync -a ./ dist/AutoFacture/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'build-launcher' \
            --exclude 'dist' \
            --exclude 'AutoFacture.exe' \
            --exclude 'storage/logs/*.log'
          cp AutoFacture.exe dist/AutoFacture/AutoFacture.exe
          cat > dist/AutoFacture/Arreter_AutoFacture.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          docker compose down
          pause
          EOF
          cat > dist/AutoFacture/Ouvrir_AutoFacture.bat <<'EOF'
          @echo off
          start "" http://localhost
          EOF
          cat > dist/AutoFacture/LISEZ-MOI.txt <<'EOF'
          AUTOFACTURE — VERSION WINDOWS ISSUE DE GITHUB
          =============================================

          Version source : feature/micro-entrepreneur-turnover
          Commit GitHub   : fb39e2ece4baf41cdc035ac7dba5fa836e25f048
          Date du commit  : 21 juillet 2026

          LANCEMENT
          ----------
          1. Décompressez entièrement le ZIP dans un dossier local.
          2. Installez et démarrez Docker Desktop avec WSL 2.
          3. Double-cliquez sur AutoFacture.exe.
          4. Le lanceur construit les conteneurs, initialise AutoFacture et ouvre http://localhost.

          CONNEXION LOCALE
          ----------------
          Identifiant : admin
          Mot de passe : autofacture-dev

          IMPORTANT
          ---------
          - Cette version est une bêta locale de développement.
          - Elle ne doit pas recevoir de données clients réelles sans validation complémentaire.
          - Le premier démarrage nécessite Docker Desktop et une connexion Internet pour les images Docker.
          - Les données MariaDB sont conservées dans le volume Docker autofacture_db.
          - Pour arrêter les services, utilisez Arreter_AutoFacture.bat.

          CONTENU
          -------
          - AutoFacture.exe : lanceur Windows 64 bits.
          - code source complet AutoFacture sous licence AGPL-3.0.
          - dépendances PHP de production et frontend Vue déjà construit.
          - configuration Docker PHP 8.4, MariaDB 10.11 et Nginx.

          SOURCE
          ------
          https://github.com/VKORONA/AutoFacture
          EOF
          cat > dist/AutoFacture/VERSION.txt <<'EOF'
          AutoFacture Windows GitHub Latest
          branch=feature/micro-entrepreneur-turnover
          commit=fb39e2ece4baf41cdc035ac7dba5fa836e25f048
          built_by=GitHub Actions
          architecture=windows-amd64
          EOF
          cd dist
          zip -r -9 ../AutoFacture_Windows_GitHub_Latest_fb39e2e.zip AutoFacture >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: AutoFacture-Windows-GitHub-Latest
          path: AutoFacture_Windows_GitHub_Latest_fb39e2e.zip
          if-no-files-found: error
          retention-days: 7
