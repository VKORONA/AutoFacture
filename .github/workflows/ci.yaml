name: AutoFacture CI

on:
  push:
    branches:
      - develop/mvp-france-ai
  pull_request:
    branches:
      - master

concurrency:
  group: autofacture-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend PHP 8.1
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, imagick, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Valider composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Installer les dépendances PHP verrouillées
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé Laravel
        run: php artisan key:generate

      - name: Vérifier les migrations SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Exécuter les tests PHP
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee backend-tests.log

      - name: Publier le journal PHP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests
          path: backend-tests.log
          retention-days: 7

      - name: Inventorier les vulnérabilités PHP
        if: always()
        run: composer audit || true

  frontend:
    name: Frontend Vue historique
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Installer les dépendances frontend historiques
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Auditer le lint historique
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test 2>&1 | tee frontend-lint.log

      - name: Construire le frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Publier les journaux frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: |
            frontend-lint.log
            frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inventorier les vulnérabilités NPM
        if: always()
        run: npm audit --omit=dev || true

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Valider Docker Compose
        run: docker compose config --quiet

      - name: Construire l'image applicative
        run: |
          set -o pipefail
          docker compose build app 2>&1 | tee docker-build.log

      - name: Publier le journal Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build
          path: docker-build.log
          retention-days: 7
