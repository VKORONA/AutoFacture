name: AutoFacture CI

on:
  push:
    branches:
      - develop/mvp-france-ai
      - develop/hardening-modernization
  pull_request:
    branches:
      - master
      - develop/mvp-france-ai

concurrency:
  group: autofacture-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Laravel 12 PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, imagick, intl, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none
      - name: Préparer SQLite
        run: |
          cp .env.example .env
          touch database/database.sqlite
      - name: Installer Composer
        run: |
          set -o pipefail
          composer validate --no-check-publish 2>&1 | tee composer-validate.log
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee composer-install.log
          php artisan key:generate 2>&1 | tee artisan-bootstrap.log
      - name: Publier les journaux Composer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-bootstrap
          path: |
            composer-validate.log
            composer-install.log
            artisan-bootstrap.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Migrer et tester
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: array
        run: |
          set -o pipefail
          php artisan about --only=environment 2>&1 | tee artisan-about.log
          php artisan migrate --force 2>&1 | tee migrations.log
          php artisan test 2>&1 | tee tests.log
      - name: Publier les journaux Laravel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-runtime
          path: |
            artisan-about.log
            migrations.log
            tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Format AutoFacture
        run: vendor/bin/pint --test app/Domain/Invoicing app/Tenancy app/Security app/Providers/TenancyServiceProvider.php app/Providers/SensitiveDataServiceProvider.php app/Providers/InvoiceIntegrityServiceProvider.php app/Models/CreditNote.php app/Models/CreditNoteItem.php app/Models/IntegrationSecret.php
      - name: Analyse statique ciblée
        run: vendor/bin/phpstan analyse app/Domain/Invoicing app/Tenancy app/Security --level=3 --no-progress --memory-limit=1G
      - name: Dette de format PHP historique
        continue-on-error: true
        run: vendor/bin/pint --test
      - name: Audit dépendances PHP
        if: always()
        run: composer audit || true

  frontend:
    name: Frontend Vue historique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, openssl, pdo_sqlite, tokenizer, xml, zip
          coverage: none
      - name: Préparer Laravel
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - name: Installer le frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint AutoFacture
        run: npx eslint resources/scripts/admin/views/customers/Create.vue resources/scripts/admin/views/settings/CompanyInfoSettings.vue resources/scripts/components/icons/MainLogo.vue resources/scripts/admin/stub/customer.js
      - name: Dette de lint Crater historique
        continue-on-error: true
        run: npm run test
      - name: Construire le frontend
        run: npm run build
      - name: Audit dépendances NPM
        if: always()
        run: npm audit --omit=dev || true

  docker:
    name: Docker PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider Docker Compose
        run: docker compose config --quiet
      - name: Construire l'image
        run: docker compose build app
