name: AutoFacture CI

on:
  push:
    branches:
      - develop/mvp-france-ai
  pull_request:
    branches:
      - master

concurrency:
  group: autofacture-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend PHP 8.1
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, imagick, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Valider composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Installer les dépendances PHP verrouillées
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé Laravel
        run: php artisan key:generate

      - name: Vérifier les migrations SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Exécuter les tests PHP
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Inventorier les vulnérabilités PHP
        run: composer audit || true

  frontend:
    name: Frontend Vue historique
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Installer les dépendances frontend historiques
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Vérifier le code frontend
        run: npm run test

      - name: Construire le frontend
        run: npm run build

      - name: Inventorier les vulnérabilités NPM
        run: npm audit --omit=dev || true

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Valider Docker Compose
        run: docker compose config --quiet

      - name: Construire l'image applicative
        run: docker compose build app
